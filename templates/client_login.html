{% extends 'base.html' %}
{% load static %}
{% block title %}Portal do Cliente — Ygor Goes{% endblock %}

{% block content %}
<section style="min-height:70vh;display:flex;align-items:center">
    <div class="container" style="max-width:480px">
        <div style="text-align:center;margin-bottom:40px">
            <div style="font-size:3rem;margin-bottom:16px">🔒</div>
            <h2 class="section-title" style="font-size:1.5rem">{{ texts.client_title }}</h2>
            <p style="color:var(--muted);font-size:0.9rem">{{ texts.client_sub }}</p>
        </div>

        <form method="post" style="background:white;padding:32px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--card-shadow)">
            {% csrf_token %}
            {% if error %}
            <div style="padding:12px 16px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;margin-bottom:16px;font-size:0.82rem;color:#991b1b">
                {{ texts.client_error }}
            </div>
            {% endif %}
            <input type="email" name="email" placeholder="{{ texts.client_email }}" required
                   style="width:100%;padding:14px 18px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;margin-bottom:16px;background:white;color:var(--text);outline:none;transition:all 0.2s;font-family:inherit">
            <input type="password" name="password" placeholder="{{ texts.client_password }}" required
                   style="width:100%;padding:14px 18px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;margin-bottom:24px;background:white;color:var(--text);outline:none;transition:all 0.2s;font-family:inherit">
            <button type="submit" class="btn btn-accent" style="width:100%;justify-content:center">{{ texts.client_button }} →</button>
        </form>

        <p style="text-align:center;margin-top:20px;font-size:0.78rem;color:var(--muted)">{{ texts.client_footer }}</p>
    </div>
</section>
{% endblock %}
